# Spring Application Configuration
spring.application.name=recruiter-matching

# Server port — changed to 8081 because pgAdmin occupies port 8080
server.port=8081

# ============================================================
# PostgreSQL Database Configuration (RF_labs)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/RF_labs
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=######

# Execute schema.sql and data.sql automatically on application startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging configuration
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.com.example.recruitermatching=INFO
